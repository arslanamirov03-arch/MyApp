<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди предмет</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <h1>🔍 Найди предмет</h1>
    <button id="btn-menu" class="btn-ghost hidden">← В меню</button>
  </header>

  <main id="screen-menu" class="screen">
    <p class="subtitle">Выберите уровень, чтобы начать поиск</p>
    <div id="level-grid" class="level-grid"></div>
  </main>

  <main id="screen-game" class="screen hidden">
    <div class="game-layout">

      <div class="image-wrap" id="image-wrap">
        <img id="game-image" alt="Игровая сцена">
        <div id="markers-layer"></div>
      </div>

      <aside class="sidebar">
        <h2 id="level-title"></h2>

        <div class="hint-row">
          <button id="btn-hint">💡 Подсказка (<span id="hint-count">0</span>)</button>
          <button id="btn-reset" class="btn-ghost small">Сбросить</button>
        </div>

        <p class="progress-text"><span id="found-count">0</span> из <span id="total-count">0</span> найдено</p>

        <ul id="object-list" class="object-list"></ul>
      </aside>

    </div>

    <div id="win-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2>🎉 Уровень пройден!</h2>
        <p id="win-stats"></p>
        <div class="overlay-actions">
          <button id="btn-replay">Играть заново</button>
          <button id="btn-back-menu">В меню</button>
        </div>
      </div>
    </div>

  </main>

</div>
<script src="js/app.js"></script>
</body>
</html>
