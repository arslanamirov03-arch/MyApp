<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c89b6a"/>
      <stop offset="100%" stop-color="#a97c4f"/>
    </linearGradient>

    <symbol id="icon-apple" viewBox="0 0 100 100">
      <path d="M50 30 C 20 30 10 55 15 72 C 20 90 35 95 50 95 C 65 95 80 90 85 72 C 90 55 80 30 50 30 Z" fill="#e0413a"/>
      <path d="M50 30 C 45 20 50 12 60 8" stroke="#5a3a1e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="63" cy="14" rx="10" ry="6" fill="#4caf50" transform="rotate(-20 63 14)"/>
      <ellipse cx="38" cy="55" rx="8" ry="14" fill="#ffffff" opacity="0.25"/>
    </symbol>

    <symbol id="icon-book" viewBox="0 0 100 100">
      <rect x="8" y="15" width="84" height="70" rx="3" fill="#2f6fb3"/>
      <rect x="8" y="15" width="84" height="12" fill="#1d4d82"/>
      <line x1="50" y1="15" x2="50" y2="85" stroke="#1d4d82" stroke-width="3"/>
      <line x1="20" y1="45" x2="42" y2="45" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
      <line x1="20" y1="55" x2="42" y2="55" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
      <line x1="58" y1="45" x2="80" y2="45" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
      <line x1="58" y1="55" x2="80" y2="55" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    </symbol>

    <symbol id="icon-key" viewBox="0 0 100 100">
      <circle cx="26" cy="50" r="18" fill="none" stroke="#d8b23a" stroke-width="9"/>
      <rect x="42" y="45" width="50" height="10" fill="#d8b23a"/>
      <rect x="72" y="55" width="8" height="14" fill="#d8b23a"/>
      <rect x="84" y="55" width="8" height="18" fill="#d8b23a"/>
    </symbol>

    <symbol id="icon-glasses" viewBox="0 0 100 100">
      <circle cx="26" cy="50" r="20" fill="none" stroke="#333" stroke-width="6"/>
      <circle cx="74" cy="50" r="20" fill="none" stroke="#333" stroke-width="6"/>
      <line x1="46" y1="46" x2="54" y2="46" stroke="#333" stroke-width="6"/>
      <line x1="8" y1="46" x2="0" y2="42" stroke="#333" stroke-width="6"/>
      <line x1="92" y1="46" x2="100" y2="42" stroke="#333" stroke-width="6"/>
    </symbol>

    <symbol id="icon-star" viewBox="0 0 100 100">
      <polygon points="50,5 61,38 96,38 68,59 79,92 50,71 21,92 32,59 4,38 39,38" fill="#f5c518"/>
    </symbol>

    <symbol id="icon-clock" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="#fff" stroke="#333" stroke-width="5"/>
      <line x1="50" y1="50" x2="50" y2="24" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="70" y2="58" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="4" fill="#333"/>
    </symbol>

    <symbol id="icon-pencil" viewBox="0 0 100 100">
      <rect x="5" y="42" width="70" height="16" fill="#f2b90c"/>
      <rect x="5" y="42" width="10" height="16" fill="#e05a5a"/>
      <polygon points="75,42 95,50 75,58" fill="#8a5a2b"/>
      <polygon points="88,46 95,50 88,54" fill="#333"/>
    </symbol>

    <symbol id="icon-scissors" viewBox="0 0 100 100">
      <circle cx="20" cy="25" r="12" fill="none" stroke="#888" stroke-width="6"/>
      <circle cx="20" cy="75" r="12" fill="none" stroke="#888" stroke-width="6"/>
      <line x1="30" y1="30" x2="90" y2="70" stroke="#c0c0c0" stroke-width="7" stroke-linecap="round"/>
      <line x1="30" y1="70" x2="90" y2="30" stroke="#c0c0c0" stroke-width="7" stroke-linecap="round"/>
    </symbol>

    <symbol id="deco-leaf" viewBox="0 0 100 100">
      <path d="M50 10 C 80 30 80 70 50 90 C 20 70 20 30 50 10 Z" fill="#4c8c4a"/>
      <line x1="50" y1="15" x2="50" y2="85" stroke="#356b34" stroke-width="3"/>
    </symbol>

    <symbol id="deco-paper" viewBox="0 0 100 100">
      <rect x="5" y="5" width="90" height="90" fill="#fdf6e3" stroke="#e0d9c0" stroke-width="2" transform="rotate(-4 50 50)"/>
      <line x1="20" y1="30" x2="80" y2="30" stroke="#cfc7a8" stroke-width="3"/>
      <line x1="20" y1="45" x2="80" y2="45" stroke="#cfc7a8" stroke-width="3"/>
      <line x1="20" y1="60" x2="65" y2="60" stroke="#cfc7a8" stroke-width="3"/>
    </symbol>

    <symbol id="deco-stain" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#8a6a3a" stroke-width="4" opacity="0.35"/>
      <circle cx="50" cy="50" r="30" fill="#8a6a3a" opacity="0.08"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#desk)"/>
  <g stroke="#96703f" stroke-width="2" opacity="0.25">
    <line x1="0" y1="120" x2="1200" y2="110"/>
    <line x1="0" y1="260" x2="1200" y2="270"/>
    <line x1="0" y1="400" x2="1200" y2="390"/>
    <line x1="0" y1="540" x2="1200" y2="550"/>
    <line x1="0" y1="680" x2="1200" y2="670"/>
  </g>

  <!-- decorative clutter (not part of the search list) -->
  <use href="#deco-paper" x="380" y="620" width="150" height="130"/>
  <use href="#deco-paper" x="720" y="640" width="140" height="110"/>
  <use href="#deco-stain" x="840" y="510" width="90" height="90"/>
  <use href="#deco-stain" x="300" y="200" width="70" height="70"/>
  <g>
    <use href="#deco-leaf" x="10" y="640" width="80" height="110"/>
    <use href="#deco-leaf" x="55" y="660" width="70" height="100"/>
    <use href="#deco-leaf" x="-10" y="690" width="60" height="90"/>
  </g>

  <!-- findable objects -->
  <use href="#icon-apple" x="100" y="80" width="100" height="100"/>
  <use href="#icon-glasses" x="630" y="60" width="160" height="80"/>
  <use href="#icon-star" x="1000" y="90" width="90" height="90"/>
  <use href="#icon-scissors" x="820" y="260" width="140" height="140"/>
  <use href="#icon-key" x="60" y="480" width="150" height="80"/>
  <use href="#icon-clock" x="480" y="520" width="120" height="120"/>
  <use href="#icon-pencil" x="230" y="630" width="190" height="60"/>
  <use href="#icon-book" x="930" y="580" width="170" height="120"/>

  <!-- partial occlusions so a few objects are genuinely hidden -->
  <use href="#deco-leaf" x="1030" y="55" width="70" height="70"/>
  <use href="#deco-paper" x="150" y="505" width="90" height="80"/>
</svg>
