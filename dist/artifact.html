<title>Lexis — слова наизусть</title>
<style>
/* Оформление: тёплый светлый фон и прозрачное стекло без размытия.
   Стекло читается за счёт полупрозрачной заливки, светлой кромки и бликов,
   а цветные пятна фона просвечивают сквозь панели. */

:root {
  color-scheme: light;

  --ground: #F1EADE;
  --ground-tint-1: rgba(224, 138, 88, .52);
  --ground-tint-2: rgba(126, 166, 133, .42);
  --ground-tint-3: rgba(233, 196, 140, .58);
  --ground-tint-4: rgba(178, 156, 196, .32);

  --glass-top: rgba(255, 253, 250, .50);
  --glass-bottom: rgba(255, 250, 243, .18);
  --glass-edge: rgba(255, 255, 255, .9);
  --glass-shade: rgba(122, 96, 70, .16);
  --glass-inner: rgba(255, 255, 255, .95);

  --surface-1: rgba(255, 255, 255, .58);
  --surface-2: rgba(255, 255, 255, .40);
  --surface-3: rgba(255, 255, 255, .26);
  --field: rgba(255, 255, 255, .55);
  --field-focus: rgba(255, 255, 255, .78);
  --sheen: rgba(255, 255, 255, .50);
  --sheen-low: rgba(255, 255, 255, .35);
  --toast-bg: linear-gradient(160deg, rgba(255, 253, 250, .99), rgba(255, 250, 243, .97));
  --modal-bg: linear-gradient(158deg, #FDF9F2 0%, #F3E9DA 100%);

  --ink: #33291F;
  --ink-soft: #715F4C;
  --ink-faint: #9B8874;

  --accent: #C05F3C;
  --accent-deep: #9E4527;
  --accent-wash: rgba(192, 95, 60, .12);

  --calm: #5F8468;
  --calm-wash: rgba(95, 132, 104, .14);

  --alert: #B0752A;

  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;

  --display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --lift: 0 18px 40px -24px rgba(88, 62, 40, .55), 0 2px 6px -2px rgba(88, 62, 40, .12);
}

/* Тёмный вариант включается только переключателем в просмотрщике:
   приложение задумано светлым, но и в тёмной теме должно быть читаемым. */
:root[data-theme="dark"] {
  color-scheme: dark;

  --ground: #241E1A;
  --ground-tint-1: rgba(192, 95, 60, .42);
  --ground-tint-2: rgba(95, 132, 104, .34);
  --ground-tint-3: rgba(120, 96, 68, .46);
  --ground-tint-4: rgba(120, 104, 148, .30);

  --glass-top: rgba(255, 246, 236, .12);
  --glass-bottom: rgba(255, 246, 236, .05);
  --glass-edge: rgba(255, 240, 226, .26);
  --glass-shade: rgba(0, 0, 0, .34);
  --glass-inner: rgba(255, 246, 236, .22);

  --surface-1: rgba(255, 246, 236, .14);
  --surface-2: rgba(255, 246, 236, .09);
  --surface-3: rgba(255, 246, 236, .05);
  --field: rgba(255, 246, 236, .11);
  --field-focus: rgba(255, 246, 236, .17);
  --sheen: rgba(255, 246, 236, .10);
  --sheen-low: rgba(255, 246, 236, .05);
  --toast-bg: linear-gradient(160deg, rgba(60, 50, 43, .99), rgba(45, 37, 32, .98));
  --modal-bg: linear-gradient(158deg, #322A24 0%, #251F1A 100%);

  --ink: #F3E9DD;
  --ink-soft: #C9B7A3;
  --ink-faint: #9C8A78;

  --accent: #E58A63;
  --accent-deep: #F0A984;
  --accent-wash: rgba(229, 138, 99, .18);

  --calm: #8FBF9B;
  --calm-wash: rgba(143, 191, 155, .18);

  --alert: #D9A85C;

  --lift: 0 20px 44px -26px rgba(0, 0, 0, .8), 0 2px 6px -2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; min-height: 100%; }

body {
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
  background-color: var(--ground);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* Цветные пятна — то, ради чего стекло вообще имеет смысл: без них
   прозрачной панели не на чем себя показать. Два слоя дышат вразнобой,
   поэтому свет под стеклом медленно перетекает. */
body::before,
body::after {
  content: "";
  position: fixed;
  inset: -25%;
  z-index: -1;
  pointer-events: none;
  will-change: transform;
}

body::before {
  background:
    radial-gradient(38% 30% at 18% 12%, var(--ground-tint-1) 0%, transparent 68%),
    radial-gradient(34% 28% at 84% 24%, var(--ground-tint-2) 0%, transparent 66%);
  animation: drift-a 38s ease-in-out infinite alternate;
}

body::after {
  background:
    radial-gradient(42% 32% at 52% 92%, var(--ground-tint-3) 0%, transparent 70%),
    radial-gradient(30% 24% at 78% 62%, var(--ground-tint-4) 0%, transparent 68%);
  animation: drift-b 46s ease-in-out infinite alternate;
}

@keyframes drift-a {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(4%, 3%, 0) scale(1.12); }
}

@keyframes drift-b {
  from { transform: translate3d(0, 0, 0) scale(1.08); }
  to { transform: translate3d(-5%, -3%, 0) scale(1); }
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px calc(112px + env(safe-area-inset-bottom));
}

/* ---------- Стекло ---------- */

.glass {
  position: relative;
  border-radius: var(--radius-lg);
  background: linear-gradient(158deg, var(--glass-top) 0%, var(--glass-bottom) 100%);
  border: 1px solid var(--glass-edge);
  box-shadow:
    inset 0 1px 0 var(--glass-inner),
    inset 0 -1px 0 var(--sheen-low),
    var(--lift);
  overflow: hidden;
}

/* Блик по верхней кромке — «толщина» стекла. Он лежит под содержимым:
   поверх текста он выбеливал первую строку списка. */
.glass::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 42%;
  z-index: 0;
  background: linear-gradient(180deg, var(--sheen) 0%, transparent 100%);
  pointer-events: none;
}

.glass > * { position: relative; z-index: 1; }

/* ---------- Шапка ---------- */

.masthead {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(18px + env(safe-area-inset-top)) 4px 18px;
}

.mark {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(150deg, var(--surface-1), var(--surface-3));
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-inner), 0 8px 18px -12px rgba(88, 62, 40, .6);
}

.mark__glyph {
  font-family: var(--display);
  font-size: 19px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  margin-top: -1px;
}

.masthead__text { flex: 1 1 auto; min-width: 0; }

.masthead__title {
  margin: 0;
  font-family: var(--display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--ink);
}

.masthead__sub {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--ink-faint);
}

.ghost-btn {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 17px;
  color: var(--ink-soft);
  background: linear-gradient(150deg, var(--surface-1), var(--surface-3));
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-inner);
  cursor: pointer;
  transition: transform .38s cubic-bezier(.16, .84, .44, 1), color .38s ease;
}

.ghost-btn:hover { transform: translateY(-1px); color: var(--accent); }
.ghost-btn:active { transform: scale(.94); }

/* ---------- Путь ---------- */

.crumbs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  min-height: 20px;
  margin-bottom: 14px;
  padding: 0 4px;
  font-size: 13px;
  color: var(--ink-faint);
}

.crumbs__link {
  padding: 2px 0;
  font: inherit;
  color: var(--ink-soft);
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  cursor: pointer;
  transition: color .32s ease, border-color .32s ease;
}

.crumbs__link:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Возврат — крупная стрелка без подписи: в неё легко попасть пальцем. */
.round-btn {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 20px;
  line-height: 1;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-inner);
  cursor: pointer;
  transition: color .32s ease, background .32s ease,
    transform .34s cubic-bezier(.16, .84, .44, 1);
}

.round-btn:hover { color: var(--accent); }
.round-btn:active { transform: scale(.9); }

.round-btn--small { width: 30px; height: 30px; font-size: 17px; }

.crumbs__back { margin-right: 4px; }

.crumbs__sep { opacity: .45; }
.crumbs__current { color: var(--ink); }

/* ---------- Заголовки разделов ---------- */

.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 26px 4px 12px;
  font-family: var(--display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-soft);
}

.section-title:first-child { margin-top: 4px; }

.section-title__note {
  font-family: var(--body);
  font-size: 12px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

/* ---------- Карточки ---------- */

.card {
  padding: 18px 20px;
  margin-bottom: 12px;
  cursor: pointer;
  max-height: 400px;
  transition: transform .42s cubic-bezier(.16, .84, .44, 1), box-shadow .42s ease;
}

.card:hover { transform: translateY(-2px); }
.card:active { transform: scale(.992); }

.card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

/* Значки блока: сколько ждёт разбора и сколько новых — счёт у каждого
   раздела свой, поэтому и стоят они на самой карточке. */
.card__chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
  flex: 0 1 auto;
}

.card__title {
  margin: 0;
  font-family: var(--display);
  font-size: 19px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.card__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-top: 9px;
  font-size: 13px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.card__actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

/* ---------- Значки состояния ---------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--glass-edge);
}

.chip--due { color: var(--accent-deep); background: var(--accent-wash); border-color: rgba(192, 95, 60, .28); }

/* Слово записано не один раз — можно посмотреть, где ещё. */
.chip--warn {
  color: var(--alert);
  background: rgba(176, 117, 42, .12);
  border-color: rgba(176, 117, 42, .3);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.chip--calm { color: var(--calm); background: var(--calm-wash); border-color: rgba(95, 132, 104, .3); }

.chip__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ---------- Кнопки ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 20px;
  border-radius: 999px;
  font-family: var(--body);
  font-size: 14px;
  font-weight: 550;
  color: var(--ink);
  background: linear-gradient(160deg, var(--surface-1), var(--surface-3));
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-inner), 0 8px 20px -16px rgba(88, 62, 40, .7);
  cursor: pointer;
  white-space: nowrap;
  transition: transform .38s cubic-bezier(.16, .84, .44, 1), box-shadow .38s ease, background .38s ease;
}

.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.97); }

.btn--accent {
  color: #FFF6F1;
  background: linear-gradient(160deg, var(--accent) 0%, var(--accent-deep) 100%);
  border-color: rgba(158, 69, 39, .5);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .34), 0 12px 26px -16px rgba(158, 69, 39, .9);
}

.btn--calm {
  color: #F6FAF7;
  background: linear-gradient(160deg, var(--calm) 0%, #4C6F55 100%);
  border-color: rgba(76, 111, 85, .5);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 12px 26px -16px rgba(76, 111, 85, .9);
}

.btn--quiet {
  padding: 8px 14px;
  font-size: 13px;
  color: var(--ink-soft);
  background: var(--surface-2);
}

.btn--wide { width: 100%; }

.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

.btn-row { display: flex; flex-wrap: wrap; gap: 9px; }
.btn-row > .btn { flex: 1 1 auto; }

/* ---------- Кнопка добавления ---------- */

.fab {
  position: fixed;
  right: max(20px, calc(50% - 360px + 20px));
  bottom: calc(22px + env(safe-area-inset-bottom));
  width: 62px;
  height: 62px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  color: #FFF6F1;
  background: linear-gradient(155deg, var(--accent) 0%, var(--accent-deep) 100%);
  border: 1px solid rgba(255, 255, 255, .4);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .45),
    0 16px 34px -16px rgba(158, 69, 39, .95);
  cursor: pointer;
  z-index: 40;
  transition: transform .42s cubic-bezier(.16, .84, .44, 1), opacity .42s ease;
}

.fab:hover { transform: translateY(-2px) rotate(90deg); }
.fab:active { transform: scale(.92); }
.fab[hidden] { display: none; }

.fab__plus { margin-top: -3px; }

/* ---------- Сводка ---------- */

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.summary__cell {
  padding: 14px 12px;
  border-radius: var(--radius-md);
  text-align: center;
}

.summary__value {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.summary__label {
  margin-top: 3px;
  font-size: 12px;
  color: var(--ink-faint);
}

.summary__cell--due .summary__value { color: var(--accent); }
.summary__cell--mastered .summary__value { color: var(--calm); }

/* ---------- Призыв к повторению ---------- */

.call {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
}

.call__text { flex: 1 1 auto; min-width: 0; }

.call__title {
  margin: 0;
  font-family: var(--display);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
}

.call__hint {
  margin: 3px 0 0;
  font-size: 13px;
  color: var(--ink-faint);
}

/* ---------- Ввод слов ---------- */

.entry { padding: 16px; margin-bottom: 14px; }

.entry__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 11px;
}

@media (max-width: 540px) {
  .entry__grid { grid-template-columns: 1fr; }
  .summary { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .summary__cell { padding: 12px 6px; }
  .summary__value { font-size: 21px; }
}

.field { display: block; }

.field__label {
  display: block;
  margin: 0 0 6px 4px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .02em;
  color: var(--ink-soft);
}

.input,
.textarea {
  width: 100%;
  padding: 13px 16px;
  border-radius: var(--radius-md);
  font-family: var(--body);
  font-size: 16px;
  color: var(--ink);
  background: var(--field);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 2px rgba(122, 96, 70, .08);
  outline: none;
  transition: border-color .34s ease, box-shadow .34s ease, background .34s ease;
}

.input::placeholder,
.textarea::placeholder { color: var(--ink-faint); }

.input:focus,
.textarea:focus {
  background: var(--field-focus);
  border-color: rgba(192, 95, 60, .5);
  box-shadow: 0 0 0 4px var(--accent-wash);
}

.textarea {
  min-height: 160px;
  line-height: 1.6;
  resize: vertical;
}

/* Промпт длинный — ему нужно поле повыше и построже. */
.textarea--tall {
  min-height: 200px;
  font-size: 13px;
  line-height: 1.55;
}

/* ---------- Настройка внутри окна ---------- */

.setting { margin: 17px 0 3px; }

/* Длинные разделы — промпты и памятка — свёрнуты: открываются, когда нужны,
   и не растягивают окно на три экрана. */
.fold {
  margin: 12px 0 3px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-edge);
  background: var(--surface-2);
  overflow: hidden;
}

.fold__head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  list-style: none;
  transition: color .3s ease;
}

.fold__head::-webkit-details-marker { display: none; }
.fold__head:hover { color: var(--accent); }

.fold__head::after {
  content: "＋";
  margin-left: auto;
  font-size: 15px;
  color: var(--ink-faint);
}

.fold[open] .fold__head::after { content: "－"; }

.fold__body { padding: 0 14px 14px; }
.fold__body .setting { margin: 0; }

.setting__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}

.setting__head .field__label { margin: 0 0 0 4px; }

.setting__note {
  margin: 8px 4px 0;
  font-size: 12px;
  line-height: 1.55;
  color: var(--ink-faint);
}

.models { display: grid; gap: 8px; }

.model {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--glass-edge);
  cursor: pointer;
  transition: border-color .34s ease, background .34s ease;
}

.model--on {
  border-color: rgba(192, 95, 60, .45);
  background: var(--accent-wash);
}

.model__mark {
  flex: 0 0 auto;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1.5px solid rgba(122, 96, 70, .4);
  transition: border-color .34s ease, box-shadow .34s ease;
}

.model--on .model__mark {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 3.5px var(--accent);
}

.model__text {
  display: grid;
  gap: 1px;
  flex: 1 1 auto;
  min-width: 0;
}

.model__title { font-size: 14px; color: var(--ink); }

.model__id {
  font-size: 11px;
  color: var(--ink-faint);
  overflow-wrap: anywhere;
}

.model-add { display: flex; gap: 8px; margin-top: 9px; }
.model-add[hidden] { display: none; }
.model-add .input { flex: 1 1 auto; min-width: 0; }

/* ---------- Полоса заполнения ---------- */

.gauge { padding: 15px 18px; margin-bottom: 14px; }

.gauge__top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 9px;
  font-size: 13px;
  color: var(--ink-soft);
}

.gauge__value { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 550; }

.gauge__track {
  height: 8px;
  border-radius: 999px;
  background: rgba(122, 96, 70, .14);
  overflow: hidden;
}

.gauge__fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent) 0%, #D98A5F 100%);
  transition: width .9s cubic-bezier(.16, .84, .44, 1);
}

.gauge__fill--full { background: linear-gradient(90deg, var(--calm) 0%, #7FA98A 100%); }

/* ---------- Ведомость слов ---------- */

.ledger { padding: 6px 6px 8px; }

.ledger__row {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  align-items: center;
  gap: 4px 12px;
  padding: 11px 12px;

/* ===== src/js/ttf.js ===== */
/* Минимальный разбор TrueType: cmap (unicode -> glyph id), hmtx (ширины),
   head/hhea/OS2 (метрики для PDF FontDescriptor).
   Нужен для встраивания шрифта в PDF как CIDFontType2 / Identity-H. */
window.TTF = (function () {
  'use strict';

  function readTables(dv, buf) {
    var numTables = dv.getUint16(4);
    var tables = {};
    for (var i = 0; i < numTables; i++) {
      var o = 12 + i * 16;
      var tag = String.fromCharCode(buf[o], buf[o + 1], buf[o + 2], buf[o + 3]);
      tables[tag] = { offset: dv.getUint32(o + 8), length: dv.getUint32(o + 12) };
    }
    return tables;
  }

  function parseCmap4(dv, off, map) {
    var segCountX2 = dv.getUint16(off + 6);
    var segCount = segCountX2 / 2;
    var endOff = off + 14;
    var startOff = endOff + segCountX2 + 2;
    var deltaOff = startOff + segCountX2;
    var rangeOff = deltaOff + segCountX2;
    for (var s = 0; s < segCount; s++) {
      var end = dv.getUint16(endOff + s * 2);
      var start = dv.getUint16(startOff + s * 2);
      var delta = dv.getInt16(deltaOff + s * 2);
      var ro = dv.getUint16(rangeOff + s * 2);
      if (start > end) continue;
      for (var c = start; c <= end && c !== 0x10000; c++) {
        var gid;
        if (ro === 0) {
          gid = (c + delta) & 0xffff;
        } else {
          var addr = rangeOff + s * 2 + ro + (c - start) * 2;
          if (addr + 1 >= dv.byteLength) continue;
          gid = dv.getUint16(addr);
          if (gid !== 0) gid = (gid + delta) & 0xffff;
        }
        if (gid !== 0) map.set(c, gid);
      }
    }
  }

  function parseCmap12(dv, off, map) {
    var nGroups = dv.getUint32(off + 12);
    for (var g = 0; g < nGroups; g++) {
      var p = off + 16 + g * 12;
      var start = dv.getUint32(p);
      var end = dv.getUint32(p + 4);
      var startGid = dv.getUint32(p + 8);
      if (end - start > 0x10000) end = start + 0x10000;
      for (var c = start; c <= end; c++) map.set(c, startGid + (c - start));
    }
  }

  /* buf: Uint8Array с содержимым .ttf */
  function parse(buf) {
    var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    var tables = readTables(dv, buf);
    if (!tables.head || !tables.hhea || !tables.hmtx || !tables.maxp || !tables.cmap) {
      throw new Error('TTF: отсутствуют обязательные таблицы');
    }

    var head = tables.head.offset;
    var unitsPerEm = dv.getUint16(head + 18);
    var bbox = [
      dv.getInt16(head + 36), dv.getInt16(head + 38),
      dv.getInt16(head + 40), dv.getInt16(head + 42)
    ];

    var hhea = tables.hhea.offset;
    var ascent = dv.getInt16(hhea + 4);
    var descent = dv.getInt16(hhea + 6);
    var numberOfHMetrics = dv.getUint16(hhea + 34);

    var numGlyphs = dv.getUint16(tables.maxp.offset + 4);

    var widths = new Uint16Array(numGlyphs);
    var hm = tables.hmtx.offset;
    var lastWidth = 0;
    for (var i = 0; i < numGlyphs; i++) {
      if (i < numberOfHMetrics) lastWidth = dv.getUint16(hm + i * 4);
      widths[i] = lastWidth;
    }

    /* Выбираем самую подходящую подтаблицу cmap. */
    var cmapOff = tables.cmap.offset;
    var nt = dv.getUint16(cmapOff + 2);
    var best = -1, bestScore = -1, bestFmt = 0;
    for (var t = 0; t < nt; t++) {
      var p = cmapOff + 4 + t * 8;
      var pid = dv.getUint16(p);
      var eid = dv.getUint16(p + 2);
      var sub = cmapOff + dv.getUint32(p + 4);
      var fmt = dv.getUint16(sub);
      var score = -1;
      if (pid === 3 && eid === 10 && fmt === 12) score = 5;
      else if (pid === 3 && eid === 1 && fmt === 4) score = 4;
      else if (pid === 0 && fmt === 12) score = 3;
      else if (pid === 0 && fmt === 4) score = 2;
      if (score > bestScore) { bestScore = score; best = sub; bestFmt = fmt; }
    }
    if (best < 0) throw new Error('TTF: не найдена поддерживаемая подтаблица cmap');

    var map = new Map();
    if (bestFmt === 4) parseCmap4(dv, best, map);
    else if (bestFmt === 12) parseCmap12(dv, best, map);
    else throw new Error('TTF: формат cmap ' + bestFmt + ' не поддерживается');

    var italicAngle = 0;
    if (tables.post) italicAngle = dv.getInt32(tables.post.offset + 4) / 65536;

    var capHeight = Math.round(ascent * 0.7);
    if (tables['OS/2']) {
      var os2 = tables['OS/2'].offset;
      var version = dv.getUint16(os2);
      if (version >= 2 && tables['OS/2'].length >= 90) capHeight = dv.getInt16(os2 + 88);
      var typoAsc = dv.getInt16(os2 + 68);
      var typoDesc = dv.getInt16(os2 + 70);
      if (typoAsc) ascent = typoAsc;
      if (typoDesc) descent = typoDesc;
    }

    return {
      data: buf,
      unitsPerEm: unitsPerEm,
      bbox: bbox,
      ascent: ascent,
      descent: descent,
      capHeight: capHeight,
      italicAngle: italicAngle,
      numGlyphs: numGlyphs,
      widths: widths,
      cmap: map,

      /* Глиф для кодовой точки; 0 (.notdef) если символа нет в шрифте. */
      gidFor: function (code) {
        var g = this.cmap.get(code);
        return g === undefined ? 0 : g;
      },

      /* Строка -> массив glyph id (с учётом суррогатных пар). */
      glyphsFor: function (str) {
        var out = [];
        for (var i = 0; i < str.length; i++) {
          var code = str.codePointAt(i);
          if (code > 0xffff) i++;
          out.push(this.gidFor(code));
        }
        return out;
      },

      /* Ширина строки в пунктах при заданном кегле. */
      widthOf: function (str, size) {
        var total = 0;
        for (var i = 0; i < str.length; i++) {
          var code = str.codePointAt(i);
          if (code > 0xffff) i++;
          var gid = this.gidFor(code);
          total += this.widths[gid] || 0;
        }
        return (total / this.unitsPerEm) * size;
      }
    };
  }

  return { parse: parse };
})();

/* Минимальный писатель ZIP (метод store, без сжатия).
   Нужен для сборки .docx — это ZIP-контейнер с XML внутри. */
window.ZipWriter = (function () {
  'use strict';

  var CRC_TABLE = (function () {
    var table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    var c = 0xffffffff;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function utf8(str) {
    return new TextEncoder().encode(str);
  }

  /* Дата/время в формате MS-DOS, как того требует спецификация ZIP. */
  function dosDateTime(date) {
    var year = date.getFullYear();
    if (year < 1980) year = 1980;
    var time = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
    var day = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    return { time: time & 0xffff, date: day & 0xffff };
  }

  function Writer() {
    this.files = [];
    this.date = new Date();
  }

  /* content: строка (кодируется в UTF-8) или Uint8Array */
  Writer.prototype.add = function (name, content) {
    var bytes = typeof content === 'string' ? utf8(content) : content;
    this.files.push({ name: utf8(name), bytes: bytes, crc: crc32(bytes) });
    return this;
  };

  Writer.prototype.generate = function () {
    var dt = dosDateTime(this.date);
    var parts = [];
    var central = [];
    var offset = 0;
    var i;

    for (i = 0; i < this.files.length; i++) {
      var f = this.files[i];
      var local = new Uint8Array(30 + f.name.length);
      var dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);   // сигнатура локального заголовка
      dv.setUint16(4, 20, true);           // версия для распаковки
      dv.setUint16(6, 0x0800, true);       // флаг: имена в UTF-8
      dv.setUint16(8, 0, true);            // метод: store
      dv.setUint16(10, dt.time, true);
      dv.setUint16(12, dt.date, true);
      dv.setUint32(14, f.crc, true);
      dv.setUint32(18, f.bytes.length, true);
      dv.setUint32(22, f.bytes.length, true);
      dv.setUint16(26, f.name.length, true);
      dv.setUint16(28, 0, true);
      local.set(f.name, 30);
      parts.push(local, f.bytes);

      var cd = new Uint8Array(46 + f.name.length);
      var cdv = new DataView(cd.buffer);
      cdv.setUint32(0, 0x02014b50, true);  // сигнатура записи каталога
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0x0800, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, dt.time, true);
      cdv.setUint16(14, dt.date, true);
      cdv.setUint32(16, f.crc, true);
      cdv.setUint32(20, f.bytes.length, true);
      cdv.setUint32(24, f.bytes.length, true);
      cdv.setUint16(28, f.name.length, true);
      cdv.setUint32(42, offset, true);
      cd.set(f.name, 46);
      central.push(cd);

      offset += local.length + f.bytes.length;
    }

    var centralSize = 0;
    for (i = 0; i < central.length; i++) centralSize += central[i].length;

    var end = new Uint8Array(22);
    var edv = new DataView(end.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(8, this.files.length, true);
    edv.setUint16(10, this.files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, offset, true);

    var total = offset + centralSize + 22;
    var out = new Uint8Array(total);
    var pos = 0;
    for (i = 0; i < parts.length; i++) { out.set(parts[i], pos); pos += parts[i].length; }
    for (i = 0; i < central.length; i++) { out.set(central[i], pos); pos += central[i].length; }
    out.set(end, pos);
    return out;
  };

  return { Writer: Writer, crc32: crc32 };
})();

/* ===== src/js/pdf.js ===== */
/* Генератор PDF без внешних библиотек.
   Шрифт встраивается как CIDFontType2 с кодировкой Identity-H, поэтому
   в документе корректно работают и умляуты, и кириллица.
   К каждому шрифту прикладывается ToUnicode CMap — без неё текст в PDF
   нельзя было бы выделить, скопировать или прочитать программой. */
window.PDFDoc = (function () {
  'use strict';

  var A4 = { width: 595.276, height: 841.89 };

  function num(n) {
    if (!isFinite(n)) n = 0;
    var s = n.toFixed(3);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }

  function latin1Bytes(str) {
    var out = new Uint8Array(str.length);
    for (var i = 0; i < str.length; i++) out[i] = str.charCodeAt(i) & 0xff;
    return out;
  }

  function hex4(n) {
    var s = n.toString(16).toUpperCase();
    return '0000'.slice(s.length) + s;
  }

  /* Текстовая строка PDF с кириллицей: UTF-16BE + BOM в виде hex. */
  function textString(str) {
    var out = 'FEFF';
    for (var i = 0; i < str.length; i++) {
      var code = str.codePointAt(i);
      if (code > 0xffff) {
        i++;
        var v = code - 0x10000;
        out += hex4(0xd800 + (v >> 10)) + hex4(0xdc00 + (v & 0x3ff));
      } else {
        out += hex4(code);
      }
    }
    return '<' + out + '>';
  }

  function pdfDate(d) {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    var tz = -d.getTimezoneOffset();
    var sign = tz >= 0 ? '+' : '-';
    tz = Math.abs(tz);
    return 'D:' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
      p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) +
      sign + p(Math.floor(tz / 60)) + "'" + p(tz % 60) + "'";
  }

  /* ---------- Документ ---------- */

  function Doc(options) {
    options = options || {};
    this.pageSize = options.pageSize || A4;
    this.objects = [];        // тела объектов (индекс + 1 = номер объекта)
    this.pages = [];          // { content: [], }
    this.fonts = [];          // { key, ttf, used:Set, objNum }
    this.info = options.info || {};
  }

  Doc.prototype.addObject = function (body) {
    this.objects.push(body);
    return this.objects.length; // номера объектов начинаются с 1
  };

  /* ttf — результат TTF.parse(). key — имя ресурса, например 'F1'. */
  Doc.prototype.addFont = function (key, ttf, baseName) {
    var font = { key: key, ttf: ttf, used: new Set(), baseName: baseName || 'Embedded' };
    this.fonts.push(font);
    return font;
  };

  Doc.prototype.addPage = function () {
    var page = { ops: [] };
    this.pages.push(page);
    return page;
  };

  /* ---------- Рисование ---------- */

  /* tracking — разрядка; задаётся оператором Tc, а не раздельной
     отрисовкой букв, иначе текст извлекался бы с рваными пробелами. */
  Doc.prototype.text = function (page, str, x, y, font, size, color, tracking) {
    if (!str) return;
    var glyphs = font.ttf.glyphsFor(str);
    var hex = '';
    for (var i = 0; i < glyphs.length; i++) {
      hex += hex4(glyphs[i]);
      font.used.add(glyphs[i]);
    }
    var c = color || [0, 0, 0];
    page.ops.push(
      'BT ' + num(c[0]) + ' ' + num(c[1]) + ' ' + num(c[2]) + ' rg ' +
      '/' + font.key + ' ' + num(size) + ' Tf ' +
      num(tracking || 0) + ' Tc ' +
      '1 0 0 1 ' + num(x) + ' ' + num(y) + ' Tm ' +
      '<' + hex + '> Tj ET'
    );
  };

  Doc.prototype.textCentered = function (page, str, cx, y, font, size, color) {
    var w = font.ttf.widthOf(str, size);
    this.text(page, str, cx - w / 2, y, font, size, color);
  };

  Doc.prototype.textRight = function (page, str, right, y, font, size, color) {
    var w = font.ttf.widthOf(str, size);
    this.text(page, str, right - w, y, font, size, color);
  };

  /* Разрядка букв — характерный приём типографики той эпохи. */
  Doc.prototype.textTracked = function (page, str, x, y, font, size, tracking, color) {
    this.text(page, str, x, y, font, size, color, tracking);
    return this.trackedWidth(str, font, size, tracking);
  };

  Doc.prototype.trackedWidth = function (str, font, size, tracking) {
    var count = 0;
    for (var i = 0; i < str.length; i++) {
      if (str.codePointAt(i) > 0xffff) i++;
      count++;
    }
    return font.ttf.widthOf(str, size) + tracking * Math.max(0, count - 1);
  };

  Doc.prototype.rect = function (page, x, y, w, h, color) {
    var c = color || [0, 0, 0];
    page.ops.push(num(c[0]) + ' ' + num(c[1]) + ' ' + num(c[2]) + ' rg ' +
      num(x) + ' ' + num(y) + ' ' + num(w) + ' ' + num(h) + ' re f');
  };

  Doc.prototype.line = function (page, x1, y1, x2, y2, width, color) {
    var c = color || [0, 0, 0];
    page.ops.push(num(c[0]) + ' ' + num(c[1]) + ' ' + num(c[2]) + ' RG ' +
      num(width) + ' w ' + num(x1) + ' ' + num(y1) + ' m ' + num(x2) + ' ' + num(y2) + ' l S');
  };

  Doc.prototype.strokeRect = function (page, x, y, w, h, width, color) {
    var c = color || [0, 0, 0];
    page.ops.push(num(c[0]) + ' ' + num(c[1]) + ' ' + num(c[2]) + ' RG ' +
      num(width) + ' w ' + num(x) + ' ' + num(y) + ' ' + num(w) + ' ' + num(h) + ' re S');
  };

  /* Пятиконечная звезда — элемент оформления бланка. */
  Doc.prototype.star = function (page, cx, cy, radius, color) {
    var c = color || [0, 0, 0];
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var r = i % 2 === 0 ? radius : radius * 0.382;
      var a = -Math.PI / 2 + (i * Math.PI) / 5;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    var ops = num(c[0]) + ' ' + num(c[1]) + ' ' + num(c[2]) + ' rg ';
    ops += num(pts[0][0]) + ' ' + num(pts[0][1]) + ' m ';
    for (var j = 1; j < pts.length; j++) ops += num(pts[j][0]) + ' ' + num(pts[j][1]) + ' l ';
    ops += 'h f';
    page.ops.push(ops);
  };

  /* Перенос по словам с запасным разрывом внутри длинного слова. */
  Doc.prototype.wrap = function (str, font, size, maxWidth) {
    str = String(str == null ? '' : str).replace(/\s+/g, ' ').trim();
    if (!str) return [''];
    var words = str.split(' ');
    var lines = [];
    var current = '';

    function breakLongWord(word) {
      var chunk = '';
      for (var i = 0; i < word.length; i++) {
        var ch = word[i];
        if (font.ttf.widthOf(chunk + ch, size) > maxWidth && chunk) {
          lines.push(chunk);
          chunk = ch;
        } else {
          chunk += ch;
        }
      }
      return chunk;
    }

    for (var i = 0; i < words.length; i++) {
      var word = words[i];
      var candidate = current ? current + ' ' + word : word;
      if (font.ttf.widthOf(candidate, size) <= maxWidth) {
        current = candidate;
        continue;
      }
      if (current) { lines.push(current); current = ''; }
      if (font.ttf.widthOf(word, size) > maxWidth) {
        current = breakLongWord(word);
      } else {
        current = word;
      }
    }
    if (current) lines.push(current);
    return lines.length ? lines : [''];
  };

  /* ---------- Сериализация ---------- */

  function buildToUnicode(ttf, usedGlyphs) {
    /* Обратное отображение glyph id -> кодовая точка. */
    var reverse = new Map();
    ttf.cmap.forEach(function (gid, code) {
      if (!reverse.has(gid)) reverse.set(gid, code);
    });

    var entries = [];
    usedGlyphs.forEach(function (gid) {
      var code = reverse.get(gid);
      if (code !== undefined) entries.push([gid, code]);
    });
    entries.sort(function (a, b) { return a[0] - b[0]; });

    var body = '/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n' +
      '/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n' +
      '/CMapName /Adobe-Identity-UCS def\n/CMapType 2 def\n' +
      '1 begincodespacerange\n<0000> <FFFF>\nendcodespacerange\n';

    for (var i = 0; i < entries.length; i += 100) {
      var chunk = entries.slice(i, i + 100);
      body += chunk.length + ' beginbfchar\n';
      for (var j = 0; j < chunk.length; j++) {
        var code = chunk[j][1];
        var value;
        if (code > 0xffff) {
          var v = code - 0x10000;
          value = hex4(0xd800 + (v >> 10)) + hex4(0xdc00 + (v & 0x3ff));
        } else {
          value = hex4(code);
        }
        body += '<' + hex4(chunk[j][0]) + '> <' + value + '>\n';
      }
      body += 'endbfchar\n';
    }
    body += 'endcmap\nCMapName currentdict /CMap defineresource pop\nend\nend';
    return body;
  }

  function buildWidthsArray(ttf) {
    var scale = 1000 / ttf.unitsPerEm;
    var parts = [];
    for (var gid = 0; gid < ttf.numGlyphs; gid++) {
      parts.push(Math.round(ttf.widths[gid] * scale));
    }
    return '[0 [' + parts.join(' ') + ']]';
  }

  Doc.prototype.build = function () {
    var self = this;
    var chunks = [];
    var offsets = [];
    var length = 0;

    function push(data) {
      var bytes = typeof data === 'string' ? latin1Bytes(data) : data;
      chunks.push(bytes);
      length += bytes.length;
    }

    /* Резервируем номера объектов заранее: 1 — каталог, 2 — дерево страниц. */
    var catalogNum = 1;
    var pagesNum = 2;
    var nextNum = 3;
    var fontResources = [];

    var fontObjects = [];
    this.fonts.forEach(function (font) {
      var ttf = font.ttf;
      var fileNum = nextNum++;
      var descNum = nextNum++;
      var cidNum = nextNum++;
      var toUniNum = nextNum++;
      var type0Num = nextNum++;
      fontObjects.push({
        font: font, fileNum: fileNum, descNum: descNum,
        cidNum: cidNum, toUniNum: toUniNum, type0Num: type0Num
      });
      fontResources.push('/' + font.key + ' ' + type0Num + ' 0 R');
    });

    var pageNums = [];
    var contentNums = [];
    this.pages.forEach(function () {
      pageNums.push(nextNum++);
      contentNums.push(nextNum++);
    });
    var infoNum = nextNum++;
    var totalObjects = nextNum - 1;

    function beginObject(numObj) {
      offsets[numObj] = length;
      push(numObj + ' 0 obj\n');
    }

    push('%PDF-1.7\n');
    push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a])); // бинарная метка

    beginObject(catalogNum);
    push('<< /Type /Catalog /Pages ' + pagesNum + ' 0 R /Lang (de-DE) >>\nendobj\n');

    beginObject(pagesNum);
    push('<< /Type /Pages /Count ' + this.pages.length + ' /Kids [' +
      pageNums.map(function (n) { return n + ' 0 R'; }).join(' ') + '] >>\nendobj\n');

    fontObjects.forEach(function (fo) {
      var ttf = fo.font.ttf;
      var scale = 1000 / ttf.unitsPerEm;

      beginObject(fo.fileNum);
      push('<< /Length ' + ttf.data.length + ' /Length1 ' + ttf.data.length + ' >>\nstream\n');
      push(ttf.data);
      push('\nendstream\nendobj\n');

      beginObject(fo.descNum);
      push('<< /Type /FontDescriptor /FontName /' + fo.font.baseName +
        ' /Flags 32 /FontBBox [' +
        Math.round(ttf.bbox[0] * scale) + ' ' + Math.round(ttf.bbox[1] * scale) + ' ' +
        Math.round(ttf.bbox[2] * scale) + ' ' + Math.round(ttf.bbox[3] * scale) + ']' +
        ' /ItalicAngle ' + num(ttf.italicAngle) +
        ' /Ascent ' + Math.round(ttf.ascent * scale) +
        ' /Descent ' + Math.round(ttf.descent * scale) +
        ' /CapHeight ' + Math.round(ttf.capHeight * scale) +
        ' /StemV 80 /FontFile2 ' + fo.fileNum + ' 0 R >>\nendobj\n');

      beginObject(fo.cidNum);
      push('<< /Type /Font /Subtype /CIDFontType2 /BaseFont /' + fo.font.baseName +
        ' /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >>' +
        ' /FontDescriptor ' + fo.descNum + ' 0 R /DW 1000 /W ' + buildWidthsArray(ttf) +
        ' /CIDToGIDMap /Identity >>\nendobj\n');

      var toUni = buildToUnicode(ttf, fo.font.used);
      beginObject(fo.toUniNum);
      push('<< /Length ' + toUni.length + ' >>\nstream\n' + toUni + '\nendstream\nendobj\n');

      beginObject(fo.type0Num);
      push('<< /Type /Font /Subtype /Type0 /BaseFont /' + fo.font.baseName +
        ' /Encoding /Identity-H /DescendantFonts [' + fo.cidNum + ' 0 R]' +
        ' /ToUnicode ' + fo.toUniNum + ' 0 R >>\nendobj\n');
    });

    this.pages.forEach(function (page, index) {
      beginObject(pageNums[index]);
      push('<< /Type /Page /Parent ' + pagesNum + ' 0 R /MediaBox [0 0 ' +
        num(self.pageSize.width) + ' ' + num(self.pageSize.height) + ']' +
        ' /Resources << /Font << ' + fontResources.join(' ') + ' >> >>' +
        ' /Contents ' + contentNums[index] + ' 0 R >>\nendobj\n');

      var content = page.ops.join('\n');
      var contentBytes = latin1Bytes(content);
      beginObject(contentNums[index]);
      push('<< /Length ' + contentBytes.length + ' >>\nstream\n');
      push(contentBytes);
      push('\nendstream\nendobj\n');
    });

    var now = new Date();
    beginObject(infoNum);
    push('<< /Title ' + textString(this.info.title || 'Wortliste') +
      ' /Author ' + textString(this.info.author || '') +
      ' /Subject ' + textString(this.info.subject || '') +
      ' /Creator ' + textString(this.info.creator || 'Kabinett') +
      ' /Producer ' + textString(this.info.creator || 'Kabinett') +
      ' /CreationDate (' + pdfDate(now) + ') /ModDate (' + pdfDate(now) + ') >>\nendobj\n');

    var xrefOffset = length;
    var xref = 'xref\n0 ' + (totalObjects + 1) + '\n0000000000 65535 f \n';
    for (var i = 1; i <= totalObjects; i++) {
      var off = offsets[i] || 0;
      xref += ('0000000000' + off).slice(-10) + ' 00000 n \n';
    }
    push(xref);
    push('trailer\n<< /Size ' + (totalObjects + 1) + ' /Root ' + catalogNum + ' 0 R /Info ' +
      infoNum + ' 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF\n');

    var out = new Uint8Array(length);
    var pos = 0;
    for (var c = 0; c < chunks.length; c++) { out.set(chunks[c], pos); pos += chunks[c].length; }
    return out;
  };

  return { Doc: Doc, A4: A4 };
})();

/* ===== src/js/docx.js ===== */
/* Генератор .docx (Office Open XML) поверх собственного ZIP-писателя.
   Слова кладутся в настоящую таблицу Word — такой файл без потерь читают
   и Word, и LibreOffice, и парсеры документов. */
window.DocxWriter = (function () {
  'use strict';

  var W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* Word не принимает управляющие символы в тексте. */
  function clean(str) {
    return String(str == null ? '' : str).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  }

  function run(text, opts) {
    opts = opts || {};
    var props = '';
    if (opts.bold) props += '<w:b/>';
    if (opts.caps) props += '<w:caps/>';
    if (opts.color) props += '<w:color w:val="' + opts.color + '"/>';
    if (opts.size) props += '<w:sz w:val="' + opts.size * 2 + '"/><w:szCs w:val="' + opts.size * 2 + '"/>';
    if (opts.spacing) props += '<w:spacing w:val="' + opts.spacing + '"/>';
    if (opts.font) props += '<w:rFonts w:ascii="' + esc(opts.font) + '" w:hAnsi="' + esc(opts.font) + '" w:cs="' + esc(opts.font) + '"/>';
    return '<w:r>' + (props ? '<w:rPr>' + props + '</w:rPr>' : '') +
      '<w:t xml:space="preserve">' + esc(clean(text)) + '</w:t></w:r>';
  }

  function paragraph(runs, opts) {
    opts = opts || {};
    var props = '';
    if (opts.align) props += '<w:jc w:val="' + opts.align + '"/>';
    if (opts.spaceBefore || opts.spaceAfter) {
      props += '<w:spacing w:before="' + (opts.spaceBefore || 0) + '" w:after="' + (opts.spaceAfter || 0) + '"/>';
    }
    if (opts.border) {
      props += '<w:pBdr><w:bottom w:val="single" w:sz="' + (opts.border.size || 6) +
        '" w:space="4" w:color="' + (opts.border.color || '000000') + '"/></w:pBdr>';
    }
    if (opts.shading) props += '<w:shd w:val="clear" w:color="auto" w:fill="' + opts.shading + '"/>';
    if (opts.keepNext) props += '<w:keepNext/>';
    return '<w:p>' + (props ? '<w:pPr>' + props + '</w:pPr>' : '') + runs + '</w:p>';
  }

  function cell(content, widthTwips, opts) {
    opts = opts || {};
    var props = '<w:tcW w:w="' + widthTwips + '" w:type="dxa"/>';
    if (opts.shading) props += '<w:shd w:val="clear" w:color="auto" w:fill="' + opts.shading + '"/>';
    props += '<w:vAlign w:val="center"/>';
    return '<w:tc><w:tcPr>' + props + '</w:tcPr>' + content + '</w:tc>';
  }

  /* Собирает документ со словарной таблицей.
     data: { title, blockTitle, setTitle, words:[{de,ru}], meta:{...} } */
  function build(data) {
    var words = data.words || [];
    var font = 'Georgia';
    var accent = 'C05F3C';
    var gold = '9E4527';

    var colNo = 900, colDe = 4200, colRu = 4538;
    var totalWidth = colNo + colDe + colRu;

    var body = '';

    body += paragraph(
      run(data.setTitle || 'Список слов', { bold: true, size: 20, caps: true, spacing: 40, color: accent, font: font }),
      { align: 'center', spaceAfter: 40 }
    );
    body += paragraph(
      run(data.blockTitle || '', { size: 11, caps: true, spacing: 30, color: gold, font: font }),
      { align: 'center', spaceAfter: 40 }
    );
    body += paragraph(
      run((data.meta && data.meta.line) || '', { size: 9, color: '444444', font: font }),
      { align: 'center', spaceAfter: 200, border: { size: 12, color: accent } }
    );

    var rows = '';
    /* Шапка таблицы повторяется на каждой странице. */
    rows += '<w:tr><w:trPr><w:tblHeader/></w:trPr>' +
      cell(paragraph(run('№', { bold: true, size: 10, color: 'FFFFFF', font: font }), { align: 'center' }), colNo, { shading: accent }) +
      cell(paragraph(run('DEUTSCH', { bold: true, size: 10, caps: true, spacing: 20, color: 'FFFFFF', font: font })), colDe, { shading: accent }) +
      cell(paragraph(run('ÜBERSETZUNG', { bold: true, size: 10, caps: true, spacing: 20, color: 'FFFFFF', font: font })), colRu, { shading: accent }) +
      '</w:tr>';

    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      var stripe = i % 2 === 1 ? 'F7F2EA' : null;
      rows += '<w:tr>' +
        cell(paragraph(run(String(i + 1), { size: 9, color: '777777', font: font }), { align: 'center' }), colNo, { shading: stripe }) +
        cell(paragraph(run(w.de, { bold: true, size: 11, font: font })), colDe, { shading: stripe }) +
        cell(paragraph(run(w.ru, { size: 11, font: font })), colRu, { shading: stripe }) +
        '</w:tr>';
    }

    var borders = '<w:tblBorders>' +
      '<w:top w:val="single" w:sz="8" w:space="0" w:color="' + accent + '"/>' +
      '<w:left w:val="single" w:sz="8" w:space="0" w:color="' + accent + '"/>' +
      '<w:bottom w:val="single" w:sz="8" w:space="0" w:color="' + accent + '"/>' +
      '<w:right w:val="single" w:sz="8" w:space="0" w:color="' + accent + '"/>' +
      '<w:insideH w:val="single" w:sz="4" w:space="0" w:color="DCCFBD"/>' +
      '<w:insideV w:val="single" w:sz="4" w:space="0" w:color="DCCFBD"/>' +
      '</w:tblBorders>';

    body += '<w:tbl><w:tblPr><w:tblW w:w="' + totalWidth + '" w:type="dxa"/>' +
      '<w:jc w:val="center"/>' + borders +
      '<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="90" w:type="dxa"/>' +
      '<w:bottom w:w="60" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar>' +
      '</w:tblPr><w:tblGrid>' +
      '<w:gridCol w:w="' + colNo + '"/><w:gridCol w:w="' + colDe + '"/><w:gridCol w:w="' + colRu + '"/>' +
      '</w:tblGrid>' + rows + '</w:tbl>';

    body += paragraph(
      run((data.meta && data.meta.footer) || '', { size: 8, color: '777777', font: font }),
      { align: 'center', spaceBefore: 200 }
    );

    var sectPr = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" ' +
      'w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>';

    var document = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:document xmlns:w="' + W_NS + '"><w:body>' + body + sectPr + '</w:body></w:document>';

    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:styles xmlns:w="' + W_NS + '">' +
      '<w:docDefaults><w:rPrDefault><w:rPr>' +
      '<w:rFonts w:ascii="' + font + '" w:hAnsi="' + font + '" w:cs="' + font + '"/>' +
      '<w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="de-DE"/>' +
      '</w:rPr></w:rPrDefault>' +
      '<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault>' +
      '</w:docDefaults>' +
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal">' +
      '<w:name w:val="Normal"/><w:qFormat/></w:style>' +
      '</w:styles>';

    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '</Types>';

    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
      '</Relationships>';

    var docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';

    var iso = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    var core = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
      'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
      'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      '<dc:title>' + esc(data.title || '') + '</dc:title>' +
      '<dc:subject>' + esc(data.blockTitle || '') + '</dc:subject>' +
      '<cp:keywords>Lexis, Wortschatz</cp:keywords>' +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + iso + '</dcterms:created>' +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + iso + '</dcterms:modified>' +
      '</cp:coreProperties>';

    var zip = new window.ZipWriter.Writer();
    /* Порядок записей важен: [Content_Types].xml должен идти первым. */
    zip.add('[Content_Types].xml', contentTypes);
    zip.add('_rels/.rels', rels);
    zip.add('word/document.xml', document);
    zip.add('word/_rels/document.xml.rels', docRels);
    zip.add('word/styles.xml', styles);
    zip.add('docProps/core.xml', core);
    return zip.generate();
  }

  return { build: build };
})();

/* ===== src/js/export.js ===== */
/* Формирование выгрузок: PDF, Word (.docx) и простой текст.
   Файлы задуманы как «правильные»: текст в них настоящий, извлекаемый,
   с одинаковой структурой «номер / слово / перевод». */
window.Exporter = (function () {
  'use strict';

  var COLORS = {
    accent: [0.753, 0.373, 0.235],
    accentDeep: [0.620, 0.271, 0.153],
    ink: [0.200, 0.161, 0.122],
    muted: [0.443, 0.373, 0.298],
    stripe: [0.969, 0.949, 0.918],
    rule: [0.863, 0.812, 0.741]
  };

  var fontCache = null;

  /* Шрифты приложены к странице в base64 (см. сборку dist/index.html). */
  function loadFonts() {
    if (fontCache) return fontCache;
    var regular = document.getElementById('font-serif-regular');
    var bold = document.getElementById('font-serif-bold');
    if (!regular || !bold) throw new Error('Шрифты для PDF не найдены в документе');
    fontCache = {
      regular: window.TTF.parse(base64ToBytes(regular.textContent.trim())),
      bold: window.TTF.parse(base64ToBytes(bold.textContent.trim()))
    };
    return fontCache;
  }

  function base64ToBytes(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function bytesToBase64(bytes) {
    var chunk = 0x8000;
    var parts = [];
    for (var i = 0; i < bytes.length; i += chunk) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)));
    }
    return btoa(parts.join(''));
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function formatDate(ts) {
    var d = new Date(ts || Date.now());
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
  }

  function sanitizeFileName(name) {
    return String(name || 'liste')
      .replace(/[\\/:*?"<>|\x00-\x1F]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 70) || 'liste';
  }

  /* ---------- PDF ---------- */

  function buildPdf(data) {
    var fonts = loadFonts();
    var doc = new window.PDFDoc.Doc({
      info: {
        title: data.setTitle,
        subject: data.blockTitle,
        author: 'Lexis',
        creator: 'Lexis'
      }
    });

    var regular = doc.addFont('F1', fonts.regular, 'DejaVuSerif');
    var bold = doc.addFont('F2', fonts.bold, 'DejaVuSerif-Bold');

    var W = doc.pageSize.width;
    var H = doc.pageSize.height;
    var margin = 48;
    var contentLeft = margin;
    var contentRight = W - margin;
    var contentWidth = contentRight - contentLeft;

    var colNo = 32;
    var colDe = 200;
    var colRu = contentWidth - colNo - colDe;
    var cellPad = 6;
    var bodySize = 10.5;
    var lineHeight = 13;

    var words = data.words || [];
    var pages = [];
    var page = null;
    var y = 0;

    function drawPageFrame(p) {
      doc.strokeRect(p, 26, 26, W - 52, H - 52, 0.7, COLORS.rule);
    }

    function drawTableHead() {
      var rowH = 20;
      doc.rect(page, contentLeft, y - rowH, contentWidth, rowH, COLORS.accent);
      doc.text(page, '№', contentLeft + 10, y - rowH + 6.5, bold, 9, [1, 1, 1]);
      doc.textTracked(page, 'DEUTSCH', contentLeft + colNo + cellPad, y - rowH + 6.5, bold, 9, 0.8, [1, 1, 1]);
      doc.textTracked(page, 'ÜBERSETZUNG', contentLeft + colNo + colDe + cellPad, y - rowH + 6.5, bold, 9, 0.8, [1, 1, 1]);
      y -= rowH;
    }

    function newPage(isFirst) {
      page = doc.addPage();
      pages.push(page);
      drawPageFrame(page);
      y = H - margin - 6;

      if (isFirst) {
        doc.rect(page, W / 2 - 22, y - 10, 44, 1.6, COLORS.accent);
        y -= 34;

        var titleSize = 19;
        var title = (data.setTitle || 'СПИСОК СЛОВ').toUpperCase();
        var titleWidth = doc.trackedWidth(title, bold, titleSize, 2.2);
        /* Слишком длинный заголовок ужимаем, чтобы он не вылез за поля. */
        while (titleWidth > contentWidth && titleSize > 11) {
          titleSize -= 0.5;
          titleWidth = doc.trackedWidth(title, bold, titleSize, 2.2);
        }
        doc.textTracked(page, title, W / 2 - titleWidth / 2, y, bold, titleSize, 2.2, COLORS.accent);
        y -= 20;

        var sub = (data.blockTitle || '').toUpperCase();
        if (sub) {
          var subWidth = doc.trackedWidth(sub, regular, 10, 1.6);
          if (subWidth <= contentWidth) {
            doc.textTracked(page, sub, W / 2 - subWidth / 2, y, regular, 10, 1.6, COLORS.accentDeep);
          } else {
            doc.textCentered(page, sub, W / 2, y, regular, 10, COLORS.accentDeep);
          }
          y -= 16;
        }

        doc.line(page, contentLeft, y, contentRight, y, 0.8, COLORS.rule);
        y -= 15;

        var stamp = 'СЛОВ В СПИСКЕ: ' + words.length + '   ·   СОСТАВЛЕНО: ' + formatDate(Date.now());
        doc.textCentered(page, stamp, W / 2, y, regular, 8.5, COLORS.muted);
        y -= 20;
      } else {
        doc.textTracked(page, (data.setTitle || '').toUpperCase(), contentLeft, y - 4, regular, 8, 1.2, COLORS.muted);
        doc.line(page, contentLeft, y - 12, contentRight, y - 12, 0.6, COLORS.rule);
        y -= 26;
      }

      drawTableHead();
    }

    newPage(true);

    var bottomLimit = margin + 26;

    /* Длинные немецкие композиты не разрываем посередине: сначала
       подбираем кегль так, чтобы самое длинное слово влезло в колонку.
       Разорванное слово мешало бы и чтению, и разбору файла программой. */
    function fitCell(text, font, maxWidth) {
      var size = bodySize;
      var chunks = String(text == null ? '' : text).split(/\s+/);
      while (size > 7) {
        var longest = 0;
        for (var c = 0; c < chunks.length; c++) {
          longest = Math.max(longest, font.ttf.widthOf(chunks[c], size));
        }
        if (longest <= maxWidth) break;
        size -= 0.5;
      }
      return { size: size, lines: doc.wrap(text, font, size, maxWidth) };
    }

    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      var de = fitCell(w.de, bold, colDe - cellPad * 2);
      var ru = fitCell(w.ru, regular, colRu - cellPad * 2);
      var deLines = de.lines;
      var ruLines = ru.lines;
      var rows = Math.max(deLines.length, ruLines.length);
      var rowHeight = rows * lineHeight + 7;

      if (y - rowHeight < bottomLimit) newPage(false);

      var top = y;
      if (i % 2 === 1) {
        doc.rect(page, contentLeft, top - rowHeight, contentWidth, rowHeight, COLORS.stripe);
      }

      var textY = top - lineHeight + 3.5;
      doc.text(page, String(i + 1), contentLeft + 6, textY, regular, 8.5, COLORS.muted);

      var k;
      for (k = 0; k < deLines.length; k++) {
        doc.text(page, deLines[k], contentLeft + colNo + cellPad, textY - k * lineHeight, bold, de.size, COLORS.ink);
      }
      for (k = 0; k < ruLines.length; k++) {
        doc.text(page, ruLines[k], contentLeft + colNo + colDe + cellPad, textY - k * lineHeight, regular, ru.size, COLORS.ink);
      }

      y = top - rowHeight;
      doc.line(page, contentLeft, y, contentRight, y, 0.4, COLORS.rule);
    }

    /* Вертикальные линии таблицы и рамка не рисуются построчно —
       нижнюю границу последней строки уже поставили выше. */
    doc.line(page, contentLeft, y, contentRight, y, 1, COLORS.accent);

    for (var p = 0; p < pages.length; p++) {
      var footer = 'ЛИСТ ' + (p + 1) + ' ИЗ ' + pages.length;
      doc.textCentered(pages[p], footer, W / 2, margin - 12, regular, 8, COLORS.muted);
    }

    return doc.build();
  }

  /* ---------- Простой текст ---------- */

  function buildTxt(data) {
    var lines = [];
    lines.push((data.setTitle || '').toUpperCase());
    if (data.blockTitle) lines.push(data.blockTitle);
    lines.push('Слов: ' + data.words.length + ' · ' + formatDate(Date.now()));
    lines.push('');
    for (var i = 0; i < data.words.length; i++) {
      lines.push((i + 1) + '. ' + data.words[i].de + ' — ' + data.words[i].ru);
    }
    lines.push('');
    return lines.join('\r\n');
  }

  /* ---------- Сохранение ---------- */

  /* В APK файл пишет Android через мост, в браузере — обычная ссылка. */
  function save(filename, bytes, mime) {
    if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') {
      var result = window.AndroidBridge.saveFile(filename, bytesToBase64(bytes), mime);
      return { native: true, message: result };
    }
    var blob = new Blob([bytes], { type: mime });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return { native: false };
  }

  function exportSet(format, data) {
    var base = sanitizeFileName(
      (data.blockTitle ? data.blockTitle + ' — ' : '') + (data.setTitle || 'Wortliste')
    );
    if (format === 'pdf') {
      return save(base + '.pdf', buildPdf(data), 'application/pdf');
    }
    if (format === 'docx') {
      return save(base + '.docx', window.DocxWriter.build(data),
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    }
    if (format === 'txt') {
      return save(base + '.txt', new TextEncoder().encode(buildTxt(data)), 'text/plain;charset=utf-8');
    }
    throw new Error('Неизвестный формат: ' + format);
  }

  return {
    exportSet: exportSet,
    buildPdf: buildPdf,
    buildTxt: buildTxt,
    bytesToBase64: bytesToBase64,
    sanitizeFileName: sanitizeFileName,
    formatDate: formatDate
  };
})();

/* ===== src/js/media.js ===== */
/* Картинки к словам: снимок с устройства и рисунок, сделанный Gemini.
   Картинка запоминается вместе со словом — по переводу и образу слово
   вспоминается заметно легче, чем по одному переводу. */
window.Media = (function () {
  'use strict';

  var ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
  var DEFAULT_MODEL = 'gemini-3.1-flash-lite-image';
  var DEFAULT_THINK_MODEL = 'gemini-3.6-flash';
  var MAX_SIDE = 640;
  var QUALITY = 0.82;

  var SLOT_WORD = '{слово}';
  var SLOT_MEANING = '{перевод}';

  /* Промпт устроен просто: модель сама определяет, что это за слово, и берёт
     подходящую строчку из списка. Главное правило — рисовать как можно меньше:
     стрелки и раскадровки только мешали, а конкретному предмету не нужно
     ничего, кроме самого предмета. Абстрактное показывается через человека
     в обычной житейской сцене — так понятнее, чем через символы.
     Запрещено ровно одно: само слово и его перевод в кадре.

     Текст лежит здесь целиком и в готовом виде: его можно переписать
     в настройках, и меняется ровно то, что уходит модели. Подстановки
     всего две — {слово} и {перевод}. */
  var DEFAULT_PROMPT =
    'Draw a picture that instantly shows what a foreign word means. ' +
    'A learner should understand it in one second, without thinking.\n\n' +
    'WORD: "' + SLOT_WORD + '"\n' +
    'MEANING: ' + SLOT_MEANING + '\n' +
    '\nWork out for yourself what kind of word this is, and draw it accordingly:\n' +
    '- a thing: just that thing, large, whole, centred, seen from its most recognisable ' +
    'angle, and nothing else in the frame\n' +
    '- an action: one person doing it, plainly\n' +
    '- a quality: one object or person that obviously has this quality; only if the ' +
    'quality makes no sense alone, put it beside its opposite\n' +
    '- a manner: one scene in which the manner is unmistakable\n' +
    '- a feeling: one face and posture that carry it\n' +
    '- an abstract idea or idiom: the simplest everyday situation where the idea is obvious\n' +
    '- a number or amount: exactly that many identical objects\n' +
    '- a position word: two plain objects placed so their relation is the whole picture\n\n' +
    'For anything abstract — a quality, a manner, a feeling, an idea, an idiom — show a ' +
    'person in an ordinary everyday situation where the meaning is plain to see. People ' +
    'and familiar scenes are remembered far better than symbols or abstract shapes.\n\n' +
    'SIMPLICITY IS THE RULE. Use as few elements as you can. No arrows, no motion lines, ' +
    'no split screens, no before-and-after pairs, no decorative extras, unless the meaning ' +
    'truly cannot be shown without them. When in doubt, draw less. A calm obvious picture ' +
    'is better than a clever one.\n\n' +
    'STYLE: flat vector illustration, clean simple shapes, warm palette of terracotta, ' +
    'sage green, sand and cream, plain light background, one clear subject, plenty of ' +
    'empty space. Square, 1:1.\n\n' +
    'THE ONLY RULE ABOUT TEXT: the picture must not show the word "' + SLOT_WORD + '"' +
    ' or its translation "' + SLOT_MEANING + '"' +
    ', or any form of either, anywhere. Other incidental text is acceptable, ' +
    'but keep it to a minimum.';

  /* Умный режим. Обычный промпт хорошо справляется с предметом, но на
     действии, качестве, чувстве или идиоме часто промахивается. Тогда за
     дело берётся текстовая модель: она разбирает слово и сама сочиняет
     описание сцены, которую нельзя понять неправильно, — а рисует по нему
     всё та же Nano Banana. Стиль и запрет на надписи остаются прежними. */
  var DEFAULT_THINK_PROMPT =
    'You write prompts for an image model that draws one picture for a vocabulary card.\n\n' +
    'WORD: "' + SLOT_WORD + '"\n' +
    'MEANING: ' + SLOT_MEANING + '\n\n' +
    'Think first. What kind of word is this — a thing, an action, a quality, a manner, ' +
    'a feeling, an abstract idea, an idiom? Is it concrete or abstract? What single ' +
    'everyday scene would make its meaning obvious in one second to someone who does not ' +
    'know the word and cannot read a caption? A plain prompt copes with things, but fails ' +
    'on actions, qualities, feelings and idioms — your work is to find the one scene that ' +
    'cannot be misread.\n\n' +
    'Then write a single image prompt in English describing that scene concretely: who is ' +
    'in the frame, what they are doing, what surrounds them, and what exactly makes the ' +
    'meaning unmistakable. Prefer people in ordinary situations over symbols.\n\n' +
    'Your prompt must keep these rules word for word:\n' +
    '- SIMPLICITY: as few elements as possible. No arrows, no motion lines, no split ' +
    'screens, no before-and-after pairs, no decorative extras.\n' +
    '- STYLE: flat vector illustration, clean simple shapes, warm palette of terracotta, ' +
    'sage green, sand and cream, plain light background, one clear subject, plenty of ' +
    'empty space. Square, 1:1.\n' +
    '- NO TEXT: the picture must not show the word "' + SLOT_WORD + '" or its translation "' +
    SLOT_MEANING + '", or any form of either, anywhere.\n\n' +
    'Answer with the prompt itself and nothing else — no explanation, no quotes, no headings.';

  function escapeSlot(slot) {
    return slot.replace(/[{}]/g, function (ch) { return '\\' + ch; });
  }

  /* Подстановка. Перевода может не быть — тогда куски, которые без него
     теряют смысл, из промпта уходят целиком. */
  function fillPrompt(template, word, translation) {
    var text = String(template == null ? '' : template);
    if (!translation) {
      text = text
        /* Строка вида «MEANING: {перевод}» без перевода не нужна вовсе. */
        .replace(new RegExp('^[^\\n]*:[ \\t]*' + escapeSlot(SLOT_MEANING) + '[ \\t]*\\n?', 'gm'), '')
        /* Оговорка про перевод внутри строки — тоже. */
        .replace(new RegExp('[ \\t]*or its translation "' + escapeSlot(SLOT_MEANING) + '"', 'g'), '');
    }
    return text
      .split(SLOT_WORD).join(word == null ? '' : word)
      .split(SLOT_MEANING).join(translation == null ? '' : translation);
  }

  /* Промпт берётся из настроек, если человек его переписал. */
  function template() {
    var own = window.Store.getPromptTemplate && window.Store.getPromptTemplate();
    return own || DEFAULT_PROMPT;
  }

  function buildPrompt(word, translation) {
    return fillPrompt(template(), word, translation);
  }

  function thinkTemplate() {
    var own = window.Store.getThinkTemplate && window.Store.getThinkTemplate();
    return own || DEFAULT_THINK_PROMPT;
  }

  function buildThinkPrompt(word, translation) {
    return fillPrompt(thinkTemplate(), word, translation);
  }

  /* ---------- Обмен через буфер ---------- */

  /* Готовый промпт уходит в буфер: картинку можно нарисовать где угодно,
     а потом вернуть её сюда — это ничего не стоит. */
  function copyPrompt(word, translation) {
    var text = buildPrompt(word, translation);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      ok ? resolve() : reject(new Error('Скопировать не удалось — выделите промпт вручную'));
    });
  }

  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result)); };
      reader.onerror = function () { reject(new Error('не удалось прочитать картинку')); };
      reader.readAsDataURL(blob);
    });
  }

  /* Картинка из буфера. Прямое чтение доступно не везде, поэтому
     запасным путём остаётся обычная вставка в поле. */
  function readClipboardImage() {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      return Promise.reject(new Error('Буфер напрямую недоступен'));
    }
    return navigator.clipboard.read().then(function (items) {
      for (var i = 0; i < items.length; i++) {
        var types = items[i].types || [];
        for (var t = 0; t < types.length; t++) {
          if (types[t].indexOf('image/') === 0) {
            return items[i].getType(types[t]).then(blobToDataUrl).then(shrink);
          }
        }
      }
      throw new Error('В буфере нет картинки');
    });
  }

  /* Картинка из события вставки — работает даже там, где чтение буфера закрыто. */
  function imageFromPaste(event) {
    var data = event.clipboardData || window.clipboardData;
    if (!data) return null;

    var items = data.items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        var file = items[i].getAsFile();
        if (file) return blobToDataUrl(file).then(shrink);
      }
    }

    var files = data.files || [];
    if (files.length && files[0].type.indexOf('image/') === 0) {
      return blobToDataUrl(files[0]).then(shrink);
    }
    return null;
  }

  /* Ужимаем картинку: полноразмерная не нужна, а места занимает много. */
  function shrink(dataUrl) {
    return new Promise(function (resolve, reject) {
      var image = new Image();
      image.onload = function () {
        var scale = Math.min(1, MAX_SIDE / Math.max(image.width, image.height));
        var width = Math.max(1, Math.round(image.width * scale));
        var height = Math.max(1, Math.round(image.height * scale));

        var canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        var context = canvas.getContext('2d');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);

        try {
          resolve(canvas.toDataURL('image/jpeg', QUALITY));
        } catch (e) {
          reject(new Error('не удалось обработать картинку'));
        }
      };
      image.onerror = function () { reject(new Error('файл не похож на картинку')); };
      image.src = dataUrl;
    });
  }

  /* Выбор снимка из галереи или камеры устройства. */
  function pickFromDevice() {
    return new Promise(function (resolve, reject) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.position = 'fixed';
      input.style.left = '-1000px';
      document.body.appendChild(input);

      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        document.body.removeChild(input);
        if (!file) { resolve(null); return; }

        var reader = new FileReader();
        reader.onload = function () { shrink(String(reader.result)).then(resolve, reject); };
        reader.onerror = function () { reject(new Error('не удалось прочитать файл')); };
        reader.readAsDataURL(file);
      });

      input.click();
    });
  }

  function hasKey() { return !!window.Store.getApiKey(); }

  /* Один разговор с Gemini: тело запроса уходит, ответ разбирается,
     невнятные ошибки переводятся на человеческий. */
  function ask(model, body) {
    var key = window.Store.getApiKey();
    if (!key) return Promise.reject(new Error('Сначала укажите ключ Google AI в настройках'));

    return fetch(ENDPOINT + model + ':generateContent', {
      method: 'POST',
      headers: { 'x-goog-api-key': key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (response) {
      return response.json().then(function (data) {
        if (!response.ok) {
          var message = (data && data.error && data.error.message) || ('код ' + response.status);
          if (response.status === 400 && /API key/i.test(message)) {
            throw new Error('Ключ не принят — проверьте его в настройках');
          }
          if (response.status === 429) {
            throw new Error('Слишком часто — подождите немного и попробуйте снова');
          }
          if (response.status === 404) {
            throw new Error('Модель «' + model + '» недоступна — выберите другую в настройках');
          }
          throw new Error(message);
        }
        return data;
      });
    }, function (error) {
      /* Страница без доступа в сеть (например, опубликованная копия
         с ограничениями) сообщает об этом невнятно — переводим. */
      if (error instanceof TypeError) {
        throw new Error('Нет доступа к серверу Google с этой страницы');
      }
      throw error;
    });
  }

  function partsOf(data) {
    return (data.candidates && data.candidates[0] &&
      data.candidates[0].content && data.candidates[0].content.parts) || [];
  }

  /* Рисунок по готовому промпту. Ключ хранится на устройстве и в копию не попадает. */
  function draw(promptText, model) {
    return ask(model || window.Store.getModel() || DEFAULT_MODEL, {
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: {
        responseModalities: ['IMAGE'],
        imageConfig: { aspectRatio: '1:1' }
      }
    }).then(function (data) {
      var parts = partsOf(data);
      var picture = null;
      for (var i = 0; i < parts.length; i++) {
        var inline = parts[i].inlineData || parts[i].inline_data;
        if (inline && inline.data) {
          picture = 'data:' + (inline.mimeType || inline.mime_type || 'image/png') +
            ';base64,' + inline.data;
          break;
        }
      }
      if (!picture) throw new Error('Модель не вернула картинку — попробуйте ещё раз');
      return shrink(picture);
    });
  }

  function generate(word, translation, model) {
    return draw(buildPrompt(word, translation), model);
  }

  /* Модель отвечает текстом — иногда обрамляя его кавычками или разметкой. */
  function plainText(data) {
    var parts = partsOf(data);
    var text = '';
    for (var i = 0; i < parts.length; i++) {
      if (typeof parts[i].text === 'string') text += parts[i].text;
    }
    text = text.trim()
      .replace(/^```[a-z]*\s*/i, '')
      .replace(/```$/, '')
      .trim();
    if (text.length > 1 && /^["«'][\s\S]*["»']$/.test(text)) text = text.slice(1, -1).trim();
    return text;
  }

  /* Умный промпт: текстовая модель разбирает слово и пишет описание сама. */
  function think(word, translation, model) {
    return ask(model || window.Store.getThinkModel() || DEFAULT_THINK_MODEL, {
      contents: [{ parts: [{ text: buildThinkPrompt(word, translation) }] }]
    }).then(function (data) {
      var text = plainText(data);
      if (!text) throw new Error('Модель не написала промпт — попробуйте ещё раз');
      return guardText(text, word, translation);
    });
  }

  /* Подстраховка: если сочинённый промпт забыл запретить надписи,
     дописываем запрет сами — слово на картинке сводит проверку на нет. */
  function guardText(promptText, word, translation) {
    if (/must not show|no text|without any text/i.test(promptText)) return promptText;
    return promptText + '\n\nNO TEXT: the picture must not show the word "' + word + '"' +
      (translation ? ' or its translation "' + translation + '"' : '') +
      ', or any form of either, anywhere.';
  }

  /* Весь умный путь целиком: разбор слова, свой промпт, рисунок по нему. */
  function generateSmart(word, translation, onPrompt) {
    return think(word, translation).then(function (promptText) {
      if (onPrompt) onPrompt(promptText);
      return draw(promptText);
    });
  }

  /* Быстрая проверка связи: запрашивается список моделей, картинка не рисуется
     и деньги не тратятся. Нужна, чтобы сразу видеть, дело в ключе,
     в сети или в самом приложении. */
  function checkAccess() {
    var key = window.Store.getApiKey();
    if (!key) return Promise.reject(new Error('Ключ не указан'));

    return fetch('https://generativelanguage.googleapis.com/v1beta/models', {
      headers: { 'x-goog-api-key': key }
    }).then(function (response) {
      return response.json().then(function (data) {
        if (!response.ok) {
          throw new Error((data && data.error && data.error.message) || ('код ' + response.status));
        }
        var models = (data.models || []).filter(function (m) {
          return /image/.test(m.name || '');
        });
        return 'Связь есть · доступно моделей с картинками: ' + models.length;
      });
    }, function (error) {
      if (error instanceof TypeError) throw new Error('Нет доступа к серверу Google с этой страницы');
      throw error;
    });
  }

  return {
    DEFAULT_MODEL: DEFAULT_MODEL,
    DEFAULT_PROMPT: DEFAULT_PROMPT,
    SLOT_WORD: SLOT_WORD,
    SLOT_MEANING: SLOT_MEANING,
    fillPrompt: fillPrompt,
    buildPrompt: buildPrompt,
    DEFAULT_THINK_PROMPT: DEFAULT_THINK_PROMPT,
    DEFAULT_THINK_MODEL: DEFAULT_THINK_MODEL,
    buildThinkPrompt: buildThinkPrompt,
    think: think,
    draw: draw,
    generateSmart: generateSmart,
    copyPrompt: copyPrompt,
    readClipboardImage: readClipboardImage,
    imageFromPaste: imageFromPaste,
    pickFromDevice: pickFromDevice,
    shrink: shrink,
    hasKey: hasKey,
    generate: generate,
    checkAccess: checkAccess
  };
})();

/* ===== src/js/store.js ===== */
/* Хранилище и расписание повторений.

   Учебный день начинается в 6 утра, а не в полночь: слово, добавленное
   вечером, ждёт не «того же часа» на следующие сутки, а появляется
   в 6:00 следующего учебного дня. Так же считаются и все остальные
   ступени лестницы — от 1 дня до 90.

   Всё лежит в памяти устройства, интернет не нужен. */
window.Store = (function () {
  'use strict';

  var KEY = 'wortschatz.state';
  var KEY_SPARE = 'wortschatz.state.spare';
  var LEGACY_KEY = 'wortkabinett.v1';
  var DB_NAME = 'wortschatz';
  var DB_STORE = 'state';
  var DB_IMAGES = 'images';
  var DB_VERSION = 2;

  var MAX_WORDS = 500;

  /* Лестница повторений в днях. Слово поднимается на ступень после каждого
     верного ответа; пройденная последняя ступень означает, что слово освоено. */
  var INTERVALS = [1, 2, 3, 7, 14, 30, 90];
  var MAX_LEVEL = INTERVALS.length;

  var DAY = 24 * 60 * 60 * 1000;
  var DAY_START_HOUR = 6;

  /* Размеры в карточке проверки. Каждая часть тянется сама по себе:
     картинка, поле ввода, само слово и перевод — четыре независимых
