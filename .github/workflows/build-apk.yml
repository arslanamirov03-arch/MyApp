name: Build & release APK

on:
  push:
    branches: [lexis-app]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Stage signing key + source snapshot for the in-app backup feature
        run: |
          mkdir -p app/src/main/assets/signing app/src/main/assets/source
          cp signing/lexis-release.jks app/src/main/assets/signing/lexis-release.jks
          git archive --format=zip -o app/src/main/assets/source/source.zip HEAD

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect outputs
        id: out
        if: always()
        run: |
          tail -c 400000 build.log > build-${{ github.run_number }}.log || echo "no build log" > build-${{ github.run_number }}.log
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -n1)
          echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "log=build-${{ github.run_number }}.log" >> "$GITHUB_OUTPUT"

      # The release carries the APK (direct download) and always the build log,
      # so a failed build can still be diagnosed from outside Actions.
      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lexis-build-${{ github.run_number }}
          name: Lexis build ${{ github.run_number }}
          target_commitish: lexis-app
          files: |
            ${{ steps.out.outputs.apk }}
            ${{ steps.out.outputs.log }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
