name: Build Hörzeit APK

on:
  push:
    paths:
      - 'hoerzeit/**'
      - '.github/workflows/hoerzeit.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: hoerzeit
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hoerzeit-apk
          path: hoerzeit/app/build/outputs/apk/*/*.apk
