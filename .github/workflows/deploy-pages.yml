name: Deploy Game to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - hidden-object-game
  workflow_dispatch:

# No "environment:" block on purpose — deploying to a gh-pages branch avoids
# the github-pages environment branch-protection rule (which only allows the
# default branch). This lets the site publish from a feature branch too.
permissions:
  contents: write
  pages: write

concurrency:
  group: "pages-branch-deploy"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          shopt -s nullglob
          for f in image_4.png image.png image_5.png image_3.png image_2.png *.png *.jpg *.jpeg *.webp; do
            cp "$f" _site/ 2>/dev/null || true
          done
          touch _site/.nojekyll
          echo "Prepared site contents:" && ls -la _site

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enable GitHub Pages (serve from gh-pages branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Attempting to enable Pages for $REPO ..."
          # Try to create the Pages site (first-time enablement)
          create_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true)
          echo "POST /pages -> HTTP $create_status"
          # Ensure/point the source to gh-pages (idempotent update)
          update_status=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true)
          echo "PUT /pages -> HTTP $update_status"
          echo "If enablement failed (403), enable once at: https://github.com/$REPO/settings/pages"
