name: Build Sprechzeit APK

on:
  push:
    paths:
      - 'sprachtracker/**'
      - '.github/workflows/sprechzeit.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: sprachtracker
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprechzeit-debug
          path: sprachtracker/app/build/outputs/apk/debug/*.apk
