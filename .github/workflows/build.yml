name: Build and release APK

on:
  workflow_dispatch:
  push:
    branches: [claude/audio-transcription-practice-app-gu4slg]
    paths-ignore: ["**.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/ggml-small-q8_0.bin
          key: whisper-small-q8_0

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Hoerpraxis.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoerpraxis-apk
          path: Hoerpraxis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Hörpraxis 1.0"
          body: |
            Офлайн-приложение для тренировки немецкого аудирования.
            Скачайте Hoerpraxis.apk и установите на телефон (потребуется разрешить установку из неизвестных источников).
          files: Hoerpraxis.apk
