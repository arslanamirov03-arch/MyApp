name: Проверка приложения

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить зависимости
        run: npm install

      - name: Установить браузер для проверок
        run: npx playwright install --with-deps chromium

      - name: Собрать приложение
        run: npm run build

      - name: Убедиться, что собранный файл совпадает с исходниками
        run: git diff --exit-code -- dist android/app/src/main/assets

      - name: Сквозные проверки
        run: npm test

      - name: Сохранить снимки экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            dist/e2e
            dist/artifact-check
          if-no-files-found: ignore
