name: Build Perfect Audio APK

on:
  push:
    paths:
      - 'perfect-audio/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      - name: Build APK
        run: bash perfect-audio/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfectAudio-apk
          path: perfect-audio/build/PerfectAudio.apk
