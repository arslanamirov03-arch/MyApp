<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EDE4">
<meta name="description" content="Слова наизусть: блоки, списки по 500 слов, разбор по интервалам и выгрузка в PDF и Word.">
<title>Lexis — слова наизусть</title>
<!--STYLES-->
</head>
<body>

<div class="app">

  <header class="masthead">
    <div class="mark" aria-hidden="true"><span class="mark__glyph">L</span></div>
    <div class="masthead__text">
      <h1 class="masthead__title">Lexis</h1>
      <p class="masthead__sub" id="masthead-sub">Немецкие слова</p>
    </div>
    <button class="ghost-btn" id="btn-archive" type="button" title="Резервная копия" aria-label="Резервная копия">⋯</button>
  </header>

  <nav class="crumbs" id="crumbs" aria-label="Навигация"></nav>

  <main class="screen" id="screen"></main>

  <footer class="footer" id="footer-stats"></footer>

  <button class="fab" id="fab" type="button" aria-label="Добавить">
    <span class="fab__plus" aria-hidden="true">+</span>
  </button>

</div>

<div class="modal-root" id="modal-root" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="text/plain" id="font-serif-regular">/*FONT_REGULAR*/</script>
<script type="text/plain" id="font-serif-bold">/*FONT_BOLD*/</script>

<!--SCRIPTS-->
</body>
</html>
