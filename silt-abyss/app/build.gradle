plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abyss.silt'
    compileSdk 34

    defaultConfig {
        applicationId "com.abyss.silt"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// No dependencies at all: the game is plain Android Canvas plus java.lang.Math,
// which keeps the APK small and the build free of transitive conflicts.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
